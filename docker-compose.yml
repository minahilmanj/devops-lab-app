services:
  web:
    build: .
    image: devops-notes:v1
    ports:
      - "80:5000"
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
      INSTANCE_NAME: ${INSTANCE_NAME:-unknown}
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
